<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa do OSS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: um quadro fixo (1440×712) no estilo de diagrama de fluxo, escalado para a largura,
     com cinco colunas da dor à produção; abaixo, os controles e a narração de cada etapa. */
  :root {
    --bg: #0e0f0f;
    --panel: #161717;
    --rule: #303233;
    --node: #121313;
    --node-border: #44484a;
    --text: #f1f3f1;
    --muted: #9ea4a1;
    --green: #5ad26b;
    --green-soft: #7fcf8b;
    --green-glow: rgba(90, 210, 107, .55);
    --blue: #2563eb;
    --checkin: #16a34a;
    --font: "Archivo", "Arial Narrow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 32px;
  }
  .page { max-width: 1440px; margin: 0 auto; display: grid; gap: 18px; }

  /* Quadro */
  .vp { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; border-radius: 22px; }
  .sizer { position: relative; }
  .stage {
    position: absolute; top: 0; left: 0;
    width: 1440px; height: 712px;
    transform-origin: 0 0;
    background: var(--panel);
    border: 1.5px solid var(--rule);
    border-radius: 22px;
    overflow: hidden;
  }
  .head {
    position: absolute; left: 0; right: 0; top: 0; height: 64px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 26px;
    border-bottom: 1.5px solid var(--rule);
  }
  .pill {
    border: 1.5px solid #cfd3d0; border-radius: 999px;
    padding: 7px 16px; font-size: 12.5px; font-weight: 700; letter-spacing: .06em;
  }
  .head h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.005em; transition: opacity .3s; }
  .head .step { margin-left: auto; color: var(--green); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .col {
    position: absolute; top: 80px; height: 576px; width: 254px;
    border-left: 1.5px dashed #2e3132; border-right: 1.5px dashed #2e3132;
  }
  .col .lab {
    position: absolute; top: 12px; left: 0; right: 0; text-align: center;
    font-size: 11.5px; font-weight: 700; letter-spacing: .08em; color: #c9cdca;
  }
  .col::before, .col::after {
    content: ""; position: absolute; left: 14px; right: 14px; border-top: 1.5px dashed #2e3132;
  }
  .col::before { top: 0; } .col::after { bottom: 0; }

  svg.wires { position: absolute; inset: 0; width: 1440px; height: 712px; pointer-events: none; }
  .wire .base { fill: none; stroke: #3a3d3f; stroke-width: 1.3; }
  .wire .hot, .wire .flow { fill: none; stroke-linecap: round; opacity: 0; }
  .wire .hot { stroke: var(--green); stroke-width: 2.6; }
  .wire .flow { stroke: #dcffe1; stroke-width: 2; stroke-dasharray: 2 16; }
  .wire.on .hot { opacity: 1; filter: drop-shadow(0 0 4px var(--green-glow)); animation: draw .8s cubic-bezier(.4,.1,.2,1) both; animation-delay: var(--d, 0s); }
  .wire.on .flow { animation: flow 1.1s linear infinite, show .3s both; animation-delay: 0s, calc(var(--d, 0s) + .7s); }
  @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  @keyframes show { from { opacity: 0; } to { opacity: .85; } }

  .node {
    position: absolute; width: 214px; height: 48px;
    background: var(--node);
    border: 1.5px solid var(--node-border);
    border-radius: 11px;
    padding: 6px 40px 0 13px;
    transition: border-color .35s, box-shadow .35s;
  }
  .node b { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node span { display: block; font-size: 11.5px; color: var(--green-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .node.on { border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 0 18px -2px var(--green-glow); }
  .node i {
    position: absolute; right: 12px; top: 13px; width: 20px; height: 20px; border-radius: 50%;
    display: grid; place-items: center;
  }
  .node i::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #e9ebea; transition: transform .3s; }
  .node.seen i { background: var(--green); }
  .node.seen i::before {
    width: 9px; height: 5px; border-radius: 0; background: none;
    border-left: 2.4px solid #0e0f0f; border-bottom: 2.4px solid #0e0f0f;
    transform: translateY(-1px) rotate(-45deg);
  }

  .card {
    position: absolute; width: 230px;
    border: 2px solid var(--green); border-radius: 13px;
    background: var(--node);
    padding: 14px 15px 8px;
    box-shadow: 0 0 22px -6px var(--green-glow);
  }
  .card .eb { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--green); }
  .card h3 { margin: 5px 0 10px; font-size: 16.5px; font-weight: 700; text-wrap: balance; }
  .card dl { margin: 0; display: grid; }
  .card dl div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #2c2f30; font-size: 11.5px; }
  .card dt { color: #c3c7c4; white-space: nowrap; }
  .card dd { margin: 0; text-align: right; font-weight: 600; }
  .card dd.ok { color: var(--green); }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
  .card .fade, .head h1 { transition: opacity .25s; }
  .fading { opacity: 0; }
  .stem { position: absolute; width: 2px; background: var(--green); }

  .foot {
    position: absolute; left: 0; right: 0; bottom: 18px;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    font-size: 17px; font-weight: 700;
  }
  .foot::before, .foot::after { content: ""; width: 96px; height: 2px; background: var(--green); }

  /* Controles e narração */
  .ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .btn {
    font: 600 13.5px var(--font); color: var(--text);
    background: var(--panel); border: 1.5px solid var(--rule); border-radius: 999px;
    min-height: 40px; padding: 0 16px; cursor: pointer;
  }
  .btn:hover { border-color: #5b605d; }
  .btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .btn.play { border-color: var(--green); color: var(--green); min-width: 104px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 520px; }
  .chip {
    position: relative; overflow: hidden;
    font: 600 12px var(--font); color: var(--muted);
    background: transparent; border: 1.5px solid var(--rule); border-radius: 8px;
    min-height: 34px; padding: 0 10px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .chip.done { color: var(--green-soft); border-color: #2f4a34; }
  .chip.cur { color: var(--text); border-color: var(--green); }
  .chip .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--green); }
  .chip.cur.run .bar { animation: fill var(--t, 7s) linear forwards; }
  @keyframes fill { to { width: 100%; } }

  .caption {
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px;
    border-left: 2px solid var(--green); padding: 4px 0 4px 18px;
    max-width: 78ch;
  }
  .caption .eb { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; color: var(--green); }
  .caption h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
  .caption p { margin: 0; font-size: 16px; line-height: 1.6; color: #d3d7d4; }
  .caption, .caption * { transition: opacity .25s; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend .d { width: 7px; height: 7px; border-radius: 50%; background: #e9ebea; }
  .legend .c { width: 14px; height: 14px; border-radius: 50%; background: var(--green); }
  .legend .l { width: 22px; height: 2.5px; background: var(--green); box-shadow: 0 0 6px var(--green-glow); }

  @media (max-width: 640px) {
    .caption h2 { font-size: 20px; }
    .caption p { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wire.on .hot { animation: none; }
    .wire.on .flow { animation: none; opacity: 0; }
    .chip.cur.run .bar { animation: none; width: 100%; }
  }
</style>

<div class="page">
  <div class="vp" id="vp">
    <div class="sizer" id="sizer">
      <div class="stage" id="stage" role="img" aria-label="Diagrama do app OSS da dor à produção">
        <div class="head">
          <span class="pill">APP OSS</span>
          <h1 id="headTitle">A dor · o plano vivia num PDF</h1>
          <span class="step" id="headStep">etapa 1/12</span>
        </div>
        <svg class="wires" id="wires" viewBox="0 0 1440 712" aria-hidden="true"></svg>
        <div id="cols"></div>
        <div id="nodes"></div>
        <div class="foot">OSS · Jiu-Jitsu + Hipertrofia</div>
      </div>
    </div>
  </div>

  <div class="ctrl">
    <button class="btn" id="prev" type="button" aria-label="Etapa anterior">◀ Anterior</button>
    <button class="btn play" id="play" type="button">❚❚ Pausar</button>
    <button class="btn" id="next" type="button" aria-label="Próxima etapa">Próxima ▶</button>
    <div class="chips" id="chips" role="tablist" aria-label="Etapas"></div>
  </div>

  <div class="caption" aria-live="polite">
    <span class="eb" id="capEb">ETAPA 1 · NEGÓCIO</span>
    <h2 id="capTitle"></h2>
    <p id="capText"></p>
  </div>

  <div class="legend">
    <span><i class="d"></i>ainda não passou por aqui</span>
    <span><i class="c"></i>já faz parte da história</span>
    <span><i class="l"></i>caminho da etapa atual</span>
  </div>
</div>

<script>
(function () {
  var W = 1440, H = 712;
  var COLS = ['A DOR', 'PESSOAS E NEGÓCIO', 'APP · DESIGN', 'PLATAFORMA · SUPABASE', 'AMBIENTES E ENTREGA'];
  var colLeft = function (c) { return 28 + c * 274; };
  var LAYOUT = [ { y0: 140, p: 112 }, { y0: 118, p: 58 }, { y0: 118, p: 64 }, { y0: 118, p: 64 }, { y0: 118, p: 58 } ];

  var N = {
    dor_pdf:    [0, 0, 'Plano em PDF', '15 páginas, 12 repetidas'],
    dor_carga:  [0, 1, 'Carga esquecida', 'nenhum registro de série'],
    dor_semana: [0, 2, 'Semana engessada', 'aula extra bagunça o plano'],
    dor_prog:   [0, 3, 'Progresso à mão', 'tabela em branco no fim'],

    bauer:   [1, 0, 'Bauer', 'criador do plano · admin'],
    amigos:  [1, 1, 'Amigos', 'convidados · grupo fechado'],
    convite: [1, 2, 'Convite', 'código de 6 letras · 7 dias'],
    meta:    [1, 3, 'Meta', '6 semanas · ≥ 90% feitas'],

    entrada:  [2, 0, 'Entrada', 'Continuar com o Google'],
    treino:   [2, 1, 'Treino', 'atividade de hoje'],
    terminei: [2, 2, 'Registro de carga', 'terminei o exercício'],
    checkin:  [2, 3, 'Check-in', 'botão verde fixo'],
    dash:     [2, 4, 'Dashboard', 'calendário · semana × plano'],
    voce:     [2, 5, 'Você', 'treinos, semana, privacidade'],
    admin:    [2, 6, 'Monitoramento', 'admin.html'],
    mundo:    [2, 7, 'Mundo ao vivo', 'mundo.html'],

    amb:      [3, 0, 'ambiente.js', 'escolhe produção ou dev'],
    auth:     [3, 1, 'Login Google', 'Supabase Auth · PKCE'],
    db:       [3, 2, 'Postgres + RLS', 'perfis · checkins · cargas'],
    eventos:  [3, 3, 'Eventos de uso', 'em lote a cada 10 s'],
    storage:  [3, 4, 'Storage', 'fotos-checkin (privado)'],
    realtime: [3, 5, 'Realtime', 'presença ao vivo'],
    edge:     [3, 6, 'Edge Function', 'resumo-semanal · Gmail'],
    cron:     [3, 7, 'pg_cron', 'sexta, 9h'],

    branch:  [4, 0, 'Branch claude/*', 'onde nasce a mudança'],
    prdev:   [4, 1, 'PR → dev', 'merge feito pelo Claude'],
    actions: [4, 2, 'GitHub Actions', 'workflow Publicar site'],
    appdev:  [4, 3, 'App dev', '/App-Treino/dev/ · selo DEV'],
    ossdev:  [4, 4, 'Supabase oss-dev', 'banco de testes'],
    prmain:  [4, 5, 'PR dev → main', '“manda pra prod”'],
    appprod: [4, 6, 'App produção', '/App-Treino/'],
    sbprod:  [4, 7, 'Supabase produção', 'dados reais'],
    copia:   [4, 8, 'Cópia prod → dev', 'anonimizada · workflow']
  };

  var STEPS = [
    { kind: 'NEGÓCIO', head: 'A dor · o plano vivia num PDF', title: 'Tudo começa com uma dor',
      text: 'O plano de 6 semanas de Jiu-Jitsu + Hipertrofia vivia num PDF de 15 páginas, com as mesmas tabelas repetidas em 12 delas. Não havia onde anotar a carga, a semana não mudava quando surgia uma aula extra de jiu e o progresso ficava numa tabela em branco.',
      card: [['Quem sente', 'Bauer e amigos'], ['Onde estava', 'PDF de 15 páginas'], ['Repetição', '12 páginas iguais'], ['Progresso', 'anotado à mão']],
      e: ['dor_pdf>dor_carga', 'dor_pdf>dor_semana', 'dor_pdf>dor_prog'] },
    { kind: 'NEGÓCIO', head: 'Pessoas · quem sente e o que precisa', title: 'Quem sente a dor e qual é a meta',
      text: 'O Bauer criou o plano e treina 3× musculação + 2× jiu-jitsu por semana, muitas vezes com o celular numa mão entre as séries. Os amigos querem seguir o mesmo plano sem montar nada. O sucesso é completar as 6 semanas registrando pelo menos 90% das sessões, perdendo gordura sem perder força.',
      card: [['Grupo', 'fechado, por convite'], ['Rotina', '3× muscu + 2× jiu'], ['Meta', '≥ 90% das sessões'], ['Alvo do Bauer', '76 → 74 kg']],
      e: ['dor_pdf>bauer', 'dor_carga>bauer', 'dor_semana>amigos', 'dor_prog>amigos', 'bauer>amigos', 'bauer>meta'] },
    { kind: 'DESIGN', head: 'Design · um app para usar com uma mão', title: 'A solução desenhada para a academia',
      text: 'A resposta é um app web, celular primeiro, sem loja: um link HTTPS. Botões de pelo menos 48 px, check-in verde fixo ao alcance do polegar, ações no azul do tatame, tipografia Archivo e tema claro por padrão para a academia iluminada.',
      card: [['Formato', 'web, celular primeiro'], ['Fonte', 'Archivo'], ['Ações', '<i class="sw" style="background:#2563eb"></i>azul do tatame'], ['Check-in', '<i class="sw" style="background:#16a34a"></i>verde, fixo']],
      e: ['meta>entrada', 'meta>treino', 'meta>checkin', 'meta>dash'] },
    { kind: 'ARQUITETURA', head: 'Entrada · convite, Google e ambiente', title: 'Entrar no app',
      text: 'O amigo recebe um convite (código de 6 letras que vale 7 dias) e entra com a conta Google. O ambiente.js olha o endereço e decide se o app fala com o Supabase de produção ou com o de testes. Sem convite, a pessoa pede acesso e um gatilho no banco chama a Edge Function, que avisa os administradores por e-mail.',
      card: [['Tela', 'Entrada'], ['Login', 'Google (PKCE)'], ['Convite', '6 letras · 7 dias'], ['Sem convite', 'pedido + e-mail']],
      e: ['amigos>convite', 'convite>entrada', 'entrada>amb', 'amb>auth', 'auth>db', 'db>edge'] },
    { kind: 'APP', head: 'Treino · a atividade de hoje', title: 'O treino do dia, sem procurar no PDF',
      text: 'A tela Treino abre na atividade de hoje, tirada da semana que a própria pessoa monta arrastando os cards em Você → Minha semana. Cada exercício mostra dose, PSE-alvo e vídeo. Quem quiser monta até 5 treinos com a biblioteca de 71 exercícios; quem não quiser usa o plano pronto.',
      card: [['Tela', 'Treino'], ['Vem de', 'perfis.semana'], ['Biblioteca', '71 exercícios'], ['Treinos próprios', 'até 5']],
      e: ['entrada>treino', 'voce>treino', 'treino>db', 'voce>db'] },
    { kind: 'APP', head: 'Carga · registrar uma série em segundos', title: 'Registrar a carga',
      text: 'Em “Terminei o exercício” a carga já vem com a da última vez, e o recorde aparece ao lado. O peso é salvo 0,8 s depois de parar de digitar, na tabela cargas, que cada pessoa só lê e grava para si (RLS). O app também registra o evento de uso, sem o peso.',
      card: [['Tela', 'Terminei o exercício'], ['Tabela', 'cargas'], ['Salva após', '0,8 s sem digitar'], ['Meta', '≤ 5 s por série']],
      e: ['treino>terminei', 'terminei>db', 'terminei>eventos'] },
    { kind: 'APP', head: 'Check-in · o botão verde', title: 'Fazer o check-in',
      text: 'O botão verde fixo registra musculação, jiu-jitsu, muay thai, surf ou cardio, quantas vezes for preciso no dia. A foto opcional vai para um bucket privado que só a própria pessoa lê. Observações só são gravadas para quem ligou o consentimento em Privacidade (LGPD).',
      card: [['Tela', 'Novo check-in'], ['Tabela', 'checkins'], ['Foto', 'bucket privado'], ['Observação', 'só com consentimento']],
      e: ['checkin>db', 'checkin>storage', 'checkin>eventos'] },
    { kind: 'APP', head: 'Progresso · Dashboard e resumo semanal', title: 'Acompanhar o progresso',
      text: 'O Dashboard junta check-ins e cargas: calendário do mês, esta semana comparada ao plano e horas treinadas. Toda sexta às 9h o pg_cron chama a Edge Function, que manda a cada pessoa o resumo da própria semana pelo Gmail, sem nunca enviar o mesmo resumo duas vezes.',
      card: [['Tela', 'Dashboard'], ['Mostra', 'semana × plano'], ['Resumo', 'sexta, 9h'], ['Envio', 'Gmail, pela Edge Function']],
      e: ['checkin>dash', 'dash>db', 'cron>edge', 'db>edge'] },
    { kind: 'NEGÓCIO', head: 'Gestão · o grupo visto pelo administrador', title: 'Olhar o negócio',
      text: 'O Bauer acompanha o grupo no Monitoramento: quem está on-line, usuários ativos, aderência, quem sumiu, saúde do app, e-mails e convites. O Mundo ao vivo mostra cada pessoa como um personagem num mapa em pixel art. Nenhum dos dois mostra pesos, cargas ou observações.',
      card: [['Quem vê', 'administradores'], ['Telas', 'admin + mundo'], ['Fonte', 'eventos + presença'], ['Nunca mostra', 'pesos e cargas']],
      e: ['bauer>admin', 'bauer>mundo', 'admin>eventos', 'admin>db', 'mundo>realtime', 'treino>realtime'] },
    { kind: 'AMBIENTES', head: 'Desenvolvimento · a mudança chega ao /dev/', title: 'Toda mudança passa pelo dev',
      text: 'Cada mudança nasce numa branch claude/*. O Claude abre o PR para a dev e faz o merge sozinho. O workflow Publicar site monta o /App-Treino/dev/ em 1 a 2 minutos, com o selo DEV, e o ambiente.js liga esse endereço ao banco de testes oss-dev.',
      card: [['Origem', 'branch claude/*'], ['Merge', 'feito pelo Claude'], ['Publica', 'GitHub Actions'], ['Banco', 'oss-dev (testes)']],
      e: ['branch>prdev', 'prdev>actions', 'actions>appdev', 'appdev>ossdev', 'amb>ossdev'] },
    { kind: 'AMBIENTES', head: 'Produção · do dev para todo mundo', title: 'Subir para produção',
      text: 'Testado no dev, basta pedir “manda pra prod”: o Claude mescla a dev na main e o mesmo workflow publica /App-Treino/, ligado ao Supabase de produção. Mudança no banco ainda pede rodar o schema.sql à mão. Para testar com dados reais, um workflow copia a produção para o dev, anonimizada.',
      card: [['Gatilho', '“manda pra prod”'], ['Merge', 'dev → main'], ['Endereço', '/App-Treino/'], ['SQL', 'rodado à mão']],
      e: ['appdev>prmain', 'prmain>actions', 'actions>appprod', 'appprod>sbprod', 'amb>sbprod', 'sbprod>copia', 'copia>ossdev'] },
    { kind: 'VISÃO COMPLETA', head: 'Visão completa · da dor à produção', title: 'Tudo ligado',
      text: 'A dor do PDF virou um app com 8 telas, 4 tabelas protegidas por usuário, presença ao vivo, resumo semanal por e-mail e dois ambientes separados. Cada mudança passa pelo dev antes de chegar a quem treina.',
      card: [['Telas', '8'], ['Tabelas com RLS', '4'], ['Ambientes', 'dev + produção'], ['Hospedagem', 'GitHub Pages']],
      all: true }
  ];

  // Posições
  var NODE_W = 214, NODE_H = 48;
  var pos = {};
  Object.keys(N).forEach(function (id) {
    var n = N[id], L = LAYOUT[n[0]];
    pos[id] = { c: n[0], x: colLeft(n[0]) + 20, y: L.y0 + n[1] * L.p };
  });

  var stage = document.getElementById('stage');
  var colsEl = document.getElementById('cols');
  COLS.forEach(function (label, i) {
    var d = document.createElement('div');
    d.className = 'col';
    d.style.left = colLeft(i) + 'px';
    d.innerHTML = '<div class="lab">' + label + '</div>';
    colsEl.appendChild(d);
  });

  var nodesEl = document.getElementById('nodes');
  var nodeEls = {};
  Object.keys(N).forEach(function (id) {
    var n = N[id], p = pos[id];
    var d = document.createElement('div');
    d.className = 'node';
    d.style.left = p.x + 'px';
    d.style.top = p.y + 'px';
    d.innerHTML = '<b>' + n[2] + '</b><span>' + n[3] + '</span><i></i>';
    nodesEl.appendChild(d);
    nodeEls[id] = d;
  });

  // Cartão da etapa, pendurado na Meta
  var meta = pos.meta;
  var stem = document.createElement('div');
  stem.className = 'stem';
  stem.style.left = (meta.x + NODE_W / 2 - 1) + 'px';
  stem.style.top = (meta.y + NODE_H) + 'px';
  stem.style.height = '30px';
  nodesEl.appendChild(stem);
  var card = document.createElement('div');
  card.className = 'card';
  card.style.left = (meta.x - 8) + 'px';
  card.style.top = (meta.y + NODE_H + 30) + 'px';
  card.innerHTML = '<div class="fade" id="cardBody"></div>';
  nodesEl.appendChild(card);
  var cardBody = card.querySelector('#cardBody');

  // Fios
  var svg = document.getElementById('wires');
  var NS = 'http://www.w3.org/2000/svg';
  var wires = {};
  function key(a, b) { return a < b ? a + '|' + b : b + '|' + a; }
  function pathFor(a, b) {
    var A = pos[a], B = pos[b], my = NODE_H / 2;
    if (A.c === B.c) {
      var ax = A.x + NODE_W, ay = A.y + my, by = B.y + my;
      var k = Math.min(58, 16 + Math.abs(by - ay) * 0.14);
      return 'M' + ax + ' ' + ay + ' C' + (ax + k) + ' ' + ay + ', ' + (ax + k) + ' ' + by + ', ' + ax + ' ' + by;
    }
    var fromLeft = A.c < B.c;
    var sx = fromLeft ? A.x + NODE_W : A.x, sy = A.y + my;
    var tx = fromLeft ? B.x : B.x + NODE_W, ty = B.y + my;
    var dx = (tx - sx) * 0.5;
    return 'M' + sx + ' ' + sy + ' C' + (sx + dx) + ' ' + sy + ', ' + (tx - dx) + ' ' + ty + ', ' + tx + ' ' + ty;
  }
  STEPS.forEach(function (s) {
    (s.e || []).forEach(function (e) {
      var ab = e.split('>'), k = key(ab[0], ab[1]);
      if (wires[k]) return;
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'wire');
      var d = pathFor(ab[0], ab[1]);
      ['base', 'hot', 'flow'].forEach(function (cls) {
        var p = document.createElementNS(NS, 'path');
        p.setAttribute('d', d);
        p.setAttribute('class', cls);
        g.appendChild(p);
      });
      svg.appendChild(g);
      var len = g.querySelector('.hot').getTotalLength();
      g.querySelector('.hot').style.strokeDasharray = len;
      g.style.setProperty('--len', len);
      wires[k] = g;
    });
  });

  function stepNodes(s) {
    var out = {};
    var list = s.all ? Object.keys(wires).map(function (k) { return k.replace('|', '>'); }) : s.e;
    list.forEach(function (e) { e.split('>').forEach(function (id) { out[id] = 1; }); });
    return Object.keys(out);
  }

  // Controles
  var chipsEl = document.getElementById('chips');
  var chips = STEPS.map(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.setAttribute('role', 'tab');
    b.innerHTML = (i + 1) + ' · ' + s.head.split(' · ')[0] + '<i class="bar"></i>';
    b.addEventListener('click', function () { go(i, true); });
    chipsEl.appendChild(b);
    return b;
  });

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR = 7500;
  var cur = -1, playing = !reduce, timer = null;
  var playBtn = document.getElementById('play');

  function setText(el, html) {
    el.classList.add('fading');
    setTimeout(function () { el.innerHTML = html; el.classList.remove('fading'); }, 180);
  }

  function go(i, user) {
    i = (i + STEPS.length) % STEPS.length;
    cur = i;
    var s = STEPS[i];

    Object.keys(wires).forEach(function (k) { wires[k].classList.remove('on'); });
    void svg.getBoundingClientRect();
    var list = s.all ? Object.keys(wires) : s.e.map(function (e) { var ab = e.split('>'); return key(ab[0], ab[1]); });
    list.forEach(function (k, j) {
      var g = wires[k];
      g.style.setProperty('--d', (s.all ? j * 0.03 : j * 0.14) + 's');
      g.classList.add('on');
    });

    var seen = {};
    STEPS.slice(0, i + 1).forEach(function (st) { stepNodes(st).forEach(function (id) { seen[id] = 1; }); });
    var active = {};
    stepNodes(s).forEach(function (id) { active[id] = 1; });
    Object.keys(nodeEls).forEach(function (id) {
      nodeEls[id].classList.toggle('on', !!active[id] && !s.all);
      nodeEls[id].classList.toggle('seen', !!seen[id]);
    });

    setText(document.getElementById('headTitle'), s.head);
    document.getElementById('headStep').textContent = 'etapa ' + (i + 1) + '/' + STEPS.length;
    setText(cardBody,
      '<div class="eb">ETAPA ' + (i + 1) + ' · ' + s.kind + '</div><h3>' + s.title + '</h3><dl>' +
      s.card.map(function (r, j) {
        return '<div><dt>' + r[0] + '</dt><dd' + (j === s.card.length - 1 ? ' class="ok"' : '') + '>' + r[1] + '</dd></div>';
      }).join('') + '</dl>');
    document.getElementById('capEb').textContent = 'ETAPA ' + (i + 1) + ' DE ' + STEPS.length + ' · ' + s.kind;
    setText(document.getElementById('capTitle'), s.title);
    setText(document.getElementById('capText'), s.text);

    chips.forEach(function (c, j) {
      c.classList.toggle('done', j < i);
      c.classList.toggle('cur', j === i);
      c.classList.remove('run');
      c.setAttribute('aria-selected', j === i ? 'true' : 'false');
    });
    scrollToActive(Object.keys(active), s.all);
    schedule();
  }

  function schedule() {
    clearTimeout(timer);
    var c = chips[cur];
    if (playing) {
      c.style.setProperty('--t', DUR + 'ms');
      void c.offsetWidth;
      c.classList.add('run');
      timer = setTimeout(function () { go(cur + 1); }, DUR);
    }
    playBtn.textContent = playing ? '❚❚ Pausar' : '▶ Tocar';
  }

  playBtn.addEventListener('click', function () {
    playing = !playing;
    chips[cur].classList.remove('run');
    schedule();
  });
  document.getElementById('prev').addEventListener('click', function () { go(cur - 1, true); });
  document.getElementById('next').addEventListener('click', function () { go(cur + 1, true); });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowRight') go(cur + 1, true);
    if (ev.key === 'ArrowLeft') go(cur - 1, true);
    if (ev.key === ' ' && ev.target === document.body) { ev.preventDefault(); playBtn.click(); }
  });

  // Escala do quadro
  var vp = document.getElementById('vp'), sizer = document.getElementById('sizer');
  var scale = 1;
  function fit() {
    var w = vp.clientWidth;
    scale = Math.min(1, Math.max(0.5, w / W));
    stage.style.transform = 'scale(' + scale + ')';
    sizer.style.width = (W * scale) + 'px';
    sizer.style.height = (H * scale) + 'px';
  }
  function scrollToActive(ids, all) {
    if (vp.scrollWidth <= vp.clientWidth + 2) return;
    if (all) { vp.scrollTo({ left: 0, behavior: reduce ? 'auto' : 'smooth' }); return; }
    var xs = ids.map(function (id) { return pos[id].x; });
    var mid = (Math.min.apply(null, xs) + Math.max.apply(null, xs) + NODE_W) / 2 * scale;
    vp.scrollTo({ left: Math.max(0, mid - vp.clientWidth / 2), behavior: reduce ? 'auto' : 'smooth' });
  }
  window.addEventListener('resize', fit);
  fit();
  go(0);
})();
</script>
</html>
