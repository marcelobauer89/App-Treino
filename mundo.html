<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Mundo ao vivo • App Treino</title>
<script src="ambiente.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Press+Start+2P&display=swap">
<style>
  /* O mundo tem paleta própria (estilo jogo retrô), igual no tema claro e no escuro. */
  :root {
    --fundo: #0b0d10; --caixa: #1b1f2a; --texto: #f3f4f6; --texto-2: #a9b4c6; --borda: #ffffff; --sombra: #000000;
    --ao-vivo: #22c55e; --ouro: #f5b301; --erro: #ff6b6b; --link: #9ec1ff;
    --musc: #2a78d6; --jiu: #eb6834; --bike: #1baf7a;
    --px: "Press Start 2P", ui-monospace, monospace;
    --ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
  button, a { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)); }

  .topo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding-top: 20px; padding-bottom: 16px; }
  h1 { margin: 0; font-family: var(--px); font-size: clamp(16px, 3.4vw, 24px); line-height: 1.3; color: var(--ouro); text-shadow: 3px 3px 0 var(--sombra); }
  .sub { margin: 6px 0 0; color: var(--texto-2); font-size: 14px; }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .botao {
    min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
    background: var(--caixa); border: 3px solid var(--borda); box-shadow: 4px 4px 0 var(--sombra); font-family: var(--px); font-size: 10px;
  }
  .botao:hover { background: #262c3b; }
  .botao.primario { background: #16a34a; }

  .caixa { background: var(--caixa); border: 3px solid var(--borda); box-shadow: 0 0 0 3px var(--sombra), 5px 5px 0 3px var(--sombra); }
  .estado { padding: 24px; max-width: 560px; margin: 40px auto; text-align: center; line-height: 1.5; }
  .estado p { margin: 0 0 16px; }
  .estado p:last-child { margin-bottom: 0; }

  /* Palco: o mapa em pixel art (SVG 320×180) com os personagens e balões por cima. */
  .palco { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 3px solid var(--borda); box-shadow: 0 0 0 3px var(--sombra), 6px 6px 0 3px var(--sombra); background: #5cb85c; }
  /* Em tela cheia (telão), o palco fica centralizado em 16:9 sobre fundo preto. */
  .moldura:fullscreen { display: flex; align-items: center; justify-content: center; background: #000; }
  .moldura:fullscreen .palco { width: min(100vw, 177.78vh); border: 0; box-shadow: none; }
  #mapa { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .camada { position: absolute; inset: 0; pointer-events: none; }
  .moldura { position: relative; }
  .hud { position: absolute; top: 13px; left: 13px; right: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; pointer-events: none; }
  .hud .caixa { padding: 8px 10px; font-family: var(--px); font-size: clamp(8px, 1.1vw, 12px); line-height: 1.4; }
  .ponto { display: inline-block; width: .8em; height: .8em; background: var(--ao-vivo); margin-right: 6px; vertical-align: -1px; }
  .hud .conectando .ponto { background: var(--texto-2); }
  .hud .erro .ponto { background: var(--erro); }
  @media (prefers-reduced-motion: no-preference) { .hud .vivo .ponto { animation: pisca 1.2s steps(2) infinite; } }
  @keyframes pisca { 50% { opacity: .2; } }
  /* No celular o mapa é pequeno: o placar sai de cima dele. */
  @media (max-width: 760px) { .moldura:not(:fullscreen) .hud { position: static; margin-top: 14px; } .hud .caixa { font-size: 9px; } }

  .placa { position: absolute; transform: translate(-50%, 0); font-family: var(--px); font-size: clamp(6px, .8vw, 10px); color: #fff; background: rgba(0, 0, 0, .72); padding: 4px 6px; border: 2px solid #fff; white-space: nowrap; }
  .balao {
    position: absolute; transform: translate(-50%, -100%); background: #fff; color: #111; border: 3px solid #000; box-shadow: 3px 3px 0 rgba(0, 0, 0, .45);
    padding: 4px 8px; text-align: center; white-space: nowrap; transition: opacity .4s;
  }
  .balao::after { content: ""; position: absolute; left: 50%; bottom: -11px; margin-left: -5px; border: 5px solid transparent; border-top-color: #000; }
  .balao b { display: block; font-family: var(--px); font-size: clamp(7px, .75vw, 9px); line-height: 1.6; }
  .balao span { display: block; font-size: clamp(10px, 1vw, 13px); font-weight: 600; }
  .balao.saindo { opacity: 0; }
  .pop { position: absolute; transform: translate(-50%, -100%); font-family: var(--px); font-size: clamp(8px, 1.2vw, 14px); color: var(--ouro); text-shadow: 2px 2px 0 #000; white-space: nowrap; }
  @media (prefers-reduced-motion: no-preference) { .pop { animation: sobe 4s steps(16) forwards; } }
  @keyframes sobe { from { margin-top: 0; opacity: 1; } 80% { opacity: 1; } to { margin-top: -40px; opacity: 0; } }
  .vazio-mapa { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); padding: 10px 14px; font-family: var(--px); font-size: clamp(7px, 1vw, 11px); line-height: 1.6; text-align: center; }

  .painel { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin: 24px 0 40px; }
  @media (max-width: 760px) { .painel { grid-template-columns: 1fr; } }
  .painel .caixa { padding: 16px; }
  h2 { margin: 0 0 12px; font-family: var(--px); font-size: 11px; line-height: 1.5; }
  .feed, .fora { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .feed li { border-left: 3px solid var(--ao-vivo); padding: 2px 0 2px 10px; line-height: 1.4; }
  .feed li.recorde { border-color: var(--ouro); }
  .feed time { color: var(--link); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .fora li { display: flex; justify-content: space-between; gap: 12px; color: var(--texto-2); }
  .fora li b { color: var(--texto); font-weight: 600; }
  .nada { margin: 0; color: var(--texto-2); }
  .nota { margin: 12px 0 0; color: var(--texto-2); font-size: 13px; line-height: 1.4; }
</style>
</head>
<body>
<header class="wrap topo">
  <div>
    <h1>Mundo ao vivo</h1>
    <p class="sub">Quem está no App Treino agora e o que está fazendo, em tempo real.</p>
  </div>
  <div class="acoes" id="acoes" hidden>
    <a class="botao" href="admin.html">◀ Monitoramento</a>
    <button class="botao" type="button" id="tela-cheia">Tela cheia</button>
  </div>
</header>

<main class="wrap">
  <section class="estado caixa" id="estado" aria-live="polite"><p>Carregando…</p></section>

  <div id="conteudo" hidden>
    <div class="moldura" id="moldura">
    <div class="palco">
      <svg id="mapa" viewBox="0 0 320 180" shape-rendering="crispEdges" role="img" aria-labelledby="mapa-titulo">
        <title id="mapa-titulo">Mapa do mundo</title>
        <defs>
          <pattern id="grama" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#5cb85c"/><rect x="1" y="2" width="1" height="1" fill="#4a9a4a"/>
            <rect x="5" y="6" width="1" height="1" fill="#4a9a4a"/><rect x="6" y="1" width="1" height="1" fill="#7ccf6a"/>
          </pattern>
          <g id="arvore"><rect x="0" y="6" width="2" height="4" fill="#6b3f1d"/><rect x="-4" y="-2" width="10" height="9" fill="#2e7d32"/><rect x="-2" y="-4" width="6" height="2" fill="#2e7d32"/><rect x="-2" y="-1" width="3" height="2" fill="#43a047"/></g>
        </defs>
        <rect width="320" height="180" fill="url(#grama)"/>
        <g id="estrada"></g>
        <g>
          <use href="#arvore" x="20" y="30"/><use href="#arvore" x="36" y="44"/><use href="#arvore" x="124" y="24"/><use href="#arvore" x="128" y="96"/>
          <use href="#arvore" x="190" y="34"/><use href="#arvore" x="196" y="70"/><use href="#arvore" x="12" y="150"/><use href="#arvore" x="60" y="156"/>
          <use href="#arvore" x="110" y="150"/><use href="#arvore" x="300" y="100"/><use href="#arvore" x="266" y="14"/><use href="#arvore" x="160" y="150"/>
        </g>
        <!-- Portão OSS -->
        <g transform="translate(16,104)">
          <rect x="0" y="0" width="4" height="22" fill="#b71c1c"/><rect x="20" y="0" width="4" height="22" fill="#b71c1c"/>
          <rect x="-4" y="-2" width="32" height="4" fill="#d32f2f"/><rect x="-2" y="4" width="28" height="2" fill="#b71c1c"/>
          <rect x="7" y="6" width="10" height="6" fill="#fff"/><rect x="8" y="8" width="8" height="1" fill="#000"/><rect x="8" y="10" width="5" height="1" fill="#000"/>
        </g>
        <!-- Academia -->
        <g transform="translate(64,40)">
          <rect width="44" height="26" fill="#90a4ae"/><rect y="-6" width="44" height="6" fill="#2a78d6"/>
          <rect x="18" y="12" width="8" height="14" fill="#37474f"/><rect x="4" y="7" width="9" height="6" fill="#bbdefb"/><rect x="31" y="7" width="9" height="6" fill="#bbdefb"/>
          <rect x="12" y="-4" width="20" height="2" fill="#fff"/><rect x="14" y="-5" width="2" height="4" fill="#fff"/><rect x="28" y="-5" width="2" height="4" fill="#fff"/>
        </g>
        <!-- Tatame (dojo) -->
        <g transform="translate(160,98)">
          <rect x="2" y="6" width="40" height="20" fill="#fff3e0"/><path d="M-2 8 L22 -4 L46 8z" fill="#eb6834"/><rect x="-2" y="6" width="48" height="3" fill="#bf360c"/>
          <rect x="18" y="14" width="8" height="12" fill="#5d4037"/><rect x="6" y="12" width="7" height="6" fill="#ffe0b2"/><rect x="31" y="12" width="7" height="6" fill="#ffe0b2"/>
        </g>
        <!-- Pista de cardio -->
        <g transform="translate(208,138)">
          <rect x="0" y="0" width="100" height="36" fill="#c0573e"/><rect x="10" y="8" width="80" height="20" fill="#5cb85c"/>
          <rect x="2" y="4" width="96" height="1" fill="#f3d9cf"/><rect x="2" y="31" width="96" height="1" fill="#f3d9cf"/>
          <rect x="44" y="0" width="1" height="8" fill="#fff"/><rect x="44" y="28" width="1" height="8" fill="#fff"/>
        </g>
        <!-- Torre do Dashboard -->
        <g transform="translate(222,24)">
          <rect x="4" y="6" width="20" height="36" fill="#78909c"/><rect x="0" y="0" width="28" height="7" fill="#546e7a"/>
          <rect x="0" y="-3" width="4" height="3" fill="#546e7a"/><rect x="8" y="-3" width="4" height="3" fill="#546e7a"/><rect x="16" y="-3" width="4" height="3" fill="#546e7a"/><rect x="24" y="-3" width="4" height="3" fill="#546e7a"/>
          <rect x="8" y="12" width="3" height="12" fill="#2a78d6"/><rect x="12" y="17" width="3" height="7" fill="#eb6834"/><rect x="16" y="10" width="3" height="14" fill="#1baf7a"/>
          <rect x="11" y="32" width="6" height="10" fill="#37474f"/>
        </g>
        <!-- Casa (Você) -->
        <g transform="translate(276,40)">
          <rect y="8" width="30" height="18" fill="#ffcc80"/><path d="M-3 9 L15 -4 L33 9z" fill="#6d4c41"/>
          <rect x="12" y="15" width="6" height="11" fill="#5d4037"/><rect x="3" y="12" width="6" height="5" fill="#bbdefb"/><rect x="21" y="12" width="6" height="5" fill="#bbdefb"/>

    <div class="hud">

      <div class="caixa" id="hud-hoje">HOJE: 0 CHECK-INS · 0 RECORDES</div>
    </div>
    </div>

    <div class="painel">
      <section class="caixa" aria-labelledby="feed-titulo">
        <h2 id="feed-titulo">Acontecendo hoje</h2>
        <ul class="feed" id="feed" aria-live="polite"></ul>

      <section class="caixa" aria-labelledby="fora-titulo">
        <h2 id="fora-titulo">Fora do app</h2>
        <ul class="fora" id="fora"></ul>
        <p class="nota">Só administradores veem esta página. Pesos, cargas e observações nunca aparecem aqui.</p>
      </section>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(() => {
  // ---------- Conexão (mesmo projeto do app, definido no ambiente.js) ----------
  const SUPABASE_URL = window.AMBIENTE.url;
  const SUPABASE_KEY = window.AMBIENTE.chave;
  const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'pkce' } }) : null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const hora = (iso) => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const semMovimento = matchMedia('(prefers-reduced-motion: reduce)');
  // A fonte de pixel não tem letras acentuadas maiúsculas: nos textos em pixel, sem acento.
  const pixel = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();

  const TIPOS = { t1: 'Treino 1', t2: 'Treino 2', t3: 'Treino 3', t4: 'Treino 4', t5: 'Treino 5', jiu: 'Jiu-jitsu', muay: 'Muay Thai', surf: 'Surf', bike: 'Cardio' };
  const NOMES_TELA = { treino: 'Treino', dashboard: 'Dashboard', voce: 'Você' };

  // ---------- Mapa ----------
  // A estrada é uma linha só; cada lugar é um ponto dela. Os personagens andam por ela de um lugar a outro.
  const ESTRADA = [[30, 132], [86, 132], [86, 72], [150, 72], [150, 132], [182, 132], [236, 132], [236, 72], [291, 72]];
  const LUGARES = {
    portao: { ponto: 0, nome: 'PORTÃO OSS', placa: [30, 136] },
    academia: { ponto: 2, nome: 'ACADEMIA', placa: [86, 24] },
    tatame: { ponto: 5, nome: 'TATAME', placa: [182, 82] },
    pista: { ponto: 6, nome: 'PISTA · CARDIO', placa: [258, 152] },
    torre: { ponto: 7, nome: 'TORRE · DASHBOARD', placa: [196, 50] },
    casa: { ponto: 8, nome: 'CASA · VOCÊ', placa: [316, 24], direita: true },
  };
  const trechos = ESTRADA.slice(1).map((p, i) => Math.hypot(p[0] - ESTRADA[i][0], p[1] - ESTRADA[i][1]));
  const acumulado = ESTRADA.map((_, i) => trechos.slice(0, i).reduce((a, b) => a + b, 0));
  function pontoNa(dist) {
    for (let i = 0; i < trechos.length; i += 1) {
      if (dist <= acumulado[i + 1] || i === trechos.length - 1) {
        const t = trechos[i] ? Math.min(1, Math.max(0, (dist - acumulado[i]) / trechos[i])) : 0;
        const [a, b] = [ESTRADA[i], ESTRADA[i + 1]];
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      }
    }
    return ESTRADA[0];
  }
  function desenharMapa() {
    $('estrada').innerHTML = ESTRADA.slice(1).map((b, i) => {
      const a = ESTRADA[i];
      const x = Math.min(a[0], b[0]) - 4, y = Math.min(a[1], b[1]) - 4;
      return `<rect x="${x}" y="${y}" width="${Math.abs(b[0] - a[0]) + 8}" height="${Math.abs(b[1] - a[1]) + 8}" fill="#d9b77a"/>`;
    }).join('');
    $('camada').insertAdjacentHTML('beforeend', Object.values(LUGARES).map((l) =>
      `<span class="placa" style="${l.direita ? `right:${(320 - l.placa[0]) / 3.2}%;transform:none` : `left:${l.placa[0] / 3.2}%`};top:${l.placa[1] / 1.8}%">${pixel(l.nome)}</span>`).join(''));
  }

  // ---------- Personagens ----------
  const CABELOS = ['#3e2723', '#6d3b1f', '#111111', '#c99a2e', '#8d6e63'];
  const FAIXAS = ['#111111', '#7b1fa2', '#1565c0', '#6d4c41', '#2e7d32', '#c62828'];
  const KIMONOS = ['#ffffff', '#3b6fd8'];
  const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  function coresDe(id) {
    const h = hash(id);
    return { cabelo: CABELOS[h % CABELOS.length], faixa: FAIXAS[(h >>> 3) % FAIXAS.length], kimono: KIMONOS[(h >>> 6) % KIMONOS.length] };
  }
  // Sprite de 10×16, com o ponto (0,0) nos pés. Poses: parado, andando, levantando (barra acima da cabeça), correndo.
  function sprite(c, pose, quadro) {
    const r = (x, y, w, h, f) => `<rect x="${x - 5}" y="${y - 16}" width="${w}" height="${h}" fill="${f}"/>`;
    const pele = '#f1c27d';
    const passo = (pose === 'andando' || pose === 'correndo') && quadro % 2;
    let s = r(2, 0, 6, 5, pele) + r(2, 0, 6, 2, c.cabelo) + r(3, 2, 1, 1, '#000') + r(6, 2, 1, 1, '#000')
      + r(1, 5, 8, 7, c.kimono) + r(1, 9, 8, 2, c.faixa)
      + r(passo ? 1 : 2, 12, 2, 4, c.kimono) + r(passo ? 7 : 6, 12, 2, 4, c.kimono);
    if (pose === 'levantando') {
      const y = quadro % 2 ? -4 : -2;
      s += r(0, y + 1, 1, 6 - y, pele) + r(9, y + 1, 1, 6 - y, pele) + r(-6, y, 22, 1, '#bdbdbd') + r(-8, y - 2, 2, 5, '#e53935') + r(16, y - 2, 2, 5, '#e53935');
    } else {
      s += r(0, 6, 1, 4, pele) + r(9, 6, 1, 4, pele);
    }
    return s;
  }

  const atores = new Map(); // id do usuário → { dist, alvo, lugar, g, balao, quadro, saindo, efeito }
  const VELOCIDADE = 45; // unidades do mapa por segundo
  let ultimoQuadro = 0, relogioPasso = 0;

  function lugarDe(meta) {
    const a = meta.acao;
    const recente = a && a.em && Date.now() - new Date(a.em) < 5 * 60000 && !a.retroativo;
    if (recente) {
      if (a.tipo === 'checkin_criado' || a.tipo === 'checkin_encerrado') return a.checkin === 'jiu' || a.checkin === 'muay' ? 'tatame' : a.checkin === 'bike' ? 'pista' : 'academia';
      if (a.tipo === 'semana_alterada') return 'casa';
      return 'academia';
    }
    return { treino: 'academia', dashboard: 'torre', voce: 'casa' }[meta.tela] || 'academia';
  }
  function statusDe(meta) {
    const a = meta.acao;
    if (a && a.em && Date.now() - new Date(a.em) < 5 * 60000) {
      if (a.tipo === 'exercicio_concluido') return `${a.exercicio} ✔`;
      if (a.tipo === 'recorde') return `Recorde: ${a.exercicio}`;
      if (a.tipo === 'checkin_criado') return `Check-in: ${TIPOS[a.checkin] || a.checkin}`;
      if (a.tipo === 'checkin_encerrado') return `Encerrou ${TIPOS[a.checkin] || a.checkin}`;
      if (a.tipo === 'video') return `▶ ${a.exercicio}`;
      if (a.tipo === 'semana_alterada') return 'Montando a semana';
    }
    return `Na tela ${NOMES_TELA[meta.tela] || meta.tela || 'Treino'}`;
  }

  function criarAtor(id, { noPortao }) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    $('personagens').appendChild(g);
    const balao = document.createElement('div');
    balao.className = 'balao';
    $('camada').appendChild(balao);
    const ator = { id, dist: 0, alvo: 0, lugar: 'portao', g, balao, cores: coresDe(id), quadro: 0, saindo: false, efeitoAte: 0, desvio: 0, nivel: 0 };
    atores.set(id, ator);
    if (!noPortao) { posicionar(ator, online.get(id)); ator.dist = ator.alvo; }
    return ator;
  }
  function posicionar(ator, meta) {
    ator.lugar = ator.saindo ? 'portao' : lugarDe(meta);
    ator.alvo = acumulado[LUGARES[ator.lugar].ponto];
    if (semMovimento.matches) ator.dist = ator.alvo;
  }
  // Quem está no mesmo lugar fica lado a lado.
  function espalhar() {
    const porLugar = {};
    atores.forEach((a) => { (porLugar[a.lugar] ||= []).push(a); });
    Object.values(porLugar).forEach((lista) => {
      lista.sort((a, b) => nomeDe(a.id).localeCompare(nomeDe(b.id), 'pt-BR'));
      // Balões alternam de altura para não se cobrirem.
      lista.forEach((a, i) => { a.desvio = (i - (lista.length - 1) / 2) * 20; a.nivel = i % 2; });
    });
  }
  function nomeDe(id) {
    const u = usuarios.find((x) => x.id === id);
    return u ? (u.nome || u.email || '').trim() : '';
  }
  const primeiroNome = (id) => (nomeDe(id).split(/[\s@]/)[0] || 'Alguém');

  function animar(t) {
    const dt = Math.min(0.1, (t - (ultimoQuadro || t)) / 1000);
    ultimoQuadro = t;
    relogioPasso += dt;
    const virouPasso = relogioPasso > 0.18;
    if (virouPasso) relogioPasso = 0;
    atores.forEach((a) => {
      const falta = a.alvo - a.dist;
      const andando = Math.abs(falta) > 0.5;
      if (andando) a.dist += Math.sign(falta) * Math.min(Math.abs(falta), VELOCIDADE * dt);
      else a.dist = a.alvo;
      if (virouPasso) a.quadro += 1;
      const meta = online.get(a.id);
      const emEfeito = Date.now() < a.efeitoAte;
      const pose = andando ? 'andando'
        : emEfeito && a.lugar === 'academia' ? 'levantando'
          : emEfeito && a.lugar === 'pista' ? 'correndo' : 'parado';
      const [x0, y] = pontoNa(a.dist);
      const x = x0 + (andando ? 0 : a.desvio);
      const chave = `${pose}|${pose === 'parado' ? 0 : a.quadro % 2}`;
      if (a.chave !== chave) { a.g.innerHTML = sprite(a.cores, pose, a.quadro); a.chave = chave; }
      a.g.setAttribute('transform', `translate(${Math.round(x)},${Math.round(y)})`);
      a.balao.style.left = `${x / 3.2}%`;
      a.balao.style.top = `${(y - 24 - (andando ? 0 : a.nivel) * 13) / 1.8}%`;
      const texto = `<b>${esc(pixel(primeiroNome(a.id)))}</b><span>${esc(a.saindo ? 'Saiu do app' : meta ? statusDe(meta) : '')}</span>`;
      if (a.texto !== texto) { a.balao.innerHTML = texto; a.texto = texto; }
      if (a.saindo && !andando && !a.removendo) {
        a.removendo = true;
        a.balao.classList.add('saindo');
        a.g.style.transition = 'opacity .6s';
        a.g.style.opacity = '0';
        setTimeout(() => { if (atores.get(a.id) === a && a.saindo) removerAtor(a); }, 700);
      }
    });
    requestAnimationFrame(animar);
  }
  function removerAtor(a) {
    a.g.remove();
    a.balao.remove();
    atores.delete(a.id);
    espalhar();
  }
  function pop(ator, texto) {
    const [x0, y] = pontoNa(ator.alvo);
    const el = document.createElement('div');
    el.className = 'pop';
    el.textContent = texto;
    el.style.left = `${(x0 + ator.desvio) / 3.2}%`;
    el.style.top = `${(y - 46 - ator.nivel * 13) / 1.8}%`;
    $('camada').appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }

  // ---------- Linha do tempo ----------
  let feed = [];
  const contagem = { checkins: 0, recordes: 0 };
  function descrever(tipo, d) {
    const tipoCheckin = TIPOS[d.checkin || d.tipo] || d.checkin || d.tipo;
    return {
      sessao: 'entrou no app',
      exercicio_concluido: `concluiu ${d.exercicio}${d.sem_peso ? ' (sem peso)' : ''}`,
      recorde: `bateu recorde em ${d.exercicio} 🏆`,
      checkin_criado: `fez check-in de ${tipoCheckin}${d.retroativo ? ' (retroativo)' : ''}`,
      checkin_encerrado: `encerrou o check-in de ${tipoCheckin}`,
      video: `viu o vídeo de ${d.exercicio}`,
      semana_alterada: 'alterou a semana',
      saiu: 'saiu da conta',
    }[tipo];
  }
  function noFeed(id, tipo, dados, em) {
    const texto = descrever(tipo, dados);
    if (!texto) return;
    feed.unshift({ id, texto, em, recorde: tipo === 'recorde' });
    feed = feed.slice(0, 40);
    if (tipo === 'checkin_criado') contagem.checkins += 1;
    if (tipo === 'recorde') contagem.recordes += 1;
    renderFeed();
  }
  function renderFeed() {
    $('feed').innerHTML = feed.length
      ? feed.map((f) => `<li${f.recorde ? ' class="recorde"' : ''}><time datetime="${esc(f.em)}">${hora(f.em)}</time><b>${esc(primeiroNome(f.id))}</b> ${esc(f.texto)}</li>`).join('')
      : '<li class="nada" style="border:0;padding:0">Nada ainda hoje.</li>';
    const c = contagem.checkins, r = contagem.recordes;
    $('hud-hoje').textContent = `HOJE: ${c} CHECK-IN${c === 1 ? '' : 'S'} · ${r} RECORDE${r === 1 ? '' : 'S'}`;
  }
  function relativo(iso) {
    if (!iso) return 'nunca entrou';
    const min = Math.floor((Date.now() - new Date(iso)) / 6e4);
    if (min < 60) return `há ${Math.max(1, min)} min`;
    if (min < 1440) return `há ${Math.floor(min / 60)} h`;
    const dias = Math.floor(min / 1440);
    return dias === 1 ? 'ontem' : `há ${dias} dias`;
  }
  function renderFora() {
    const fora = usuarios.filter((u) => !online.has(u.id))
      .sort((a, b) => String(b.ultimo_acesso || '').localeCompare(String(a.ultimo_acesso || '')));
    $('fora').innerHTML = fora.length
      ? fora.map((u) => `<li><b>${esc(u.nome || u.email)}</b><span>${esc(relativo(u.ultimo_acesso))}</span></li>`).join('')
      : '<li class="nada">Todo mundo está no app.</li>';
    const n = usuarios.length - fora.length;
    $('mapa-titulo').textContent = `Mapa do mundo: ${n} ${n === 1 ? 'pessoa' : 'pessoas'} no app agora`;
    $('camada').querySelector('.vazio-mapa')?.remove();
    if (!n && statusAoVivo !== 'erro') {
      $('camada').insertAdjacentHTML('beforeend', `<div class="vazio-mapa caixa">${pixel('Ninguém no app agora.')}<br>${pixel('Quando alguém entrar, aparece no portão.')}</div>`);
    }
  }

  // ---------- Presença ao vivo (mesmos canais do monitoramento) ----------
  let usuarios = [];
  const canais = new Map(), online = new Map();
  let statusAoVivo = 'conectando';
  function aoMudar(id, antes, depois, primeiraVez) {
    let ator = atores.get(id);
    if (depois) {
      if (!ator) ator = criarAtor(id, { noPortao: !primeiraVez });
      if (ator.saindo) { ator.saindo = false; ator.removendo = false; ator.g.style.opacity = ''; ator.balao.classList.remove('saindo'); }
      posicionar(ator, depois);
      if (!antes && !primeiraVez) noFeed(id, 'sessao', {}, new Date().toISOString());
      const a = depois.acao;
      if (a && a.em && (!antes || !antes.acao || antes.acao.em !== a.em) && !primeiraVez) {
        noFeed(id, a.tipo, a, a.em);
        ator.efeitoAte = Date.now() + 8000;
        if (a.tipo === 'recorde') pop(ator, '🏆 RECORDE!');
        else if (a.tipo === 'exercicio_concluido') pop(ator, '+XP');
        else if (a.tipo === 'checkin_criado') pop(ator, a.checkin === 'jiu' ? 'OSS!' : a.checkin === 'muay' ? 'SAWASDEE!' : 'CHECK-IN!');
      }
    } else if (ator && antes) {
      ator.saindo = true;
      posicionar(ator, antes);
    }
    espalhar();
    renderFora();
    atualizarStatus();
  }
  async function ligarAoVivo() {
    if (!sb.channel) return;
    try { if (sb.realtime && sb.realtime.setAuth) await sb.realtime.setAuth(); } catch (_) {}
    usuarios.forEach((u) => {
      if (canais.has(u.id)) return;
      const canal = sb.channel(`online:${u.id}`, { config: { private: true } });
      canal.on('presence', { event: 'sync' }, () => {
        // Mais de um aparelho aberto: vale o que entrou por último.
        const metas = Object.values(canal.presenceState()).flat().sort((a, b) => ((a.desde || '') < (b.desde || '') ? 1 : -1));
        const antes = online.get(u.id) || null;
        const depois = metas[0] || null;
        if (depois) online.set(u.id, depois); else online.delete(u.id);
        aoMudar(u.id, antes, depois, !canal.jaSincronizou);
        canal.jaSincronizou = true;
      });
      canal.subscribe((status) => { canal.situacao = status; atualizarStatus(); });
      canais.set(u.id, canal);
    });
    atualizarStatus();
  }
  function desligarAoVivo() {
    canais.forEach((c) => sb.removeChannel(c));
    canais.clear();
    online.clear();
    atores.forEach(removerAtor);
  }
  function atualizarStatus() {
    const todos = [...canais.values()];
    const ok = todos.filter((c) => c.situacao === 'SUBSCRIBED').length;
    const falhas = todos.filter((c) => ['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(c.situacao)).length;
    statusAoVivo = todos.length && falhas === todos.length ? 'erro' : ok ? 'vivo' : 'conectando';
    const n = online.size;
    $('hud-vivo').className = `caixa ${statusAoVivo}`;
    $('hud-vivo-texto').textContent = pixel(statusAoVivo === 'erro' ? 'Ao vivo indisponível'
      : statusAoVivo === 'conectando' ? 'Conectando...'
        : `Ao vivo · ${n} no app${falhas ? ` · ${falhas} sem conexão` : ''}`);
  }
  // Os balões e lugares dependem da idade da última ação; revisa a cada 30 s.
  setInterval(() => {
    atores.forEach((a) => { const m = online.get(a.id); if (m && !a.saindo) posicionar(a, m); });
    espalhar();
    atualizarStatus();
    renderFora();
  }, 30000);

  // ---------- Acesso ----------
  function mostrarEstado(html) {
    $('estado').innerHTML = html;
    $('estado').hidden = false;
    $('conteudo').hidden = true;
    $('acoes').hidden = true;
  }
  async function iniciar() {
    if (!sb) return mostrarEstado('<p>Não foi possível carregar a biblioteca do Supabase. Confira a internet e recarregue a página.</p>');
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      return mostrarEstado(`<p>Entre com a sua conta Google de administrador para ver o mundo ao vivo.</p>
        <button class="botao primario" type="button" id="entrar">Entrar com Google</button>`);
    }
    const { data: admin, error } = await sb.rpc('eh_admin');
    if (error) return mostrarEstado(`<p>Não foi possível verificar o acesso.</p><button class="botao" type="button" id="tentar">Tentar de novo</button>`);
    if (!admin) {
      return mostrarEstado(`<p><b>Acesso restrito.</b> A conta ${esc(session.user.email)} não é administradora.</p>
        <button class="botao" type="button" id="sair">Entrar com outra conta</button>`);
    }
    mostrarEstado('<p>Carregando o mundo…</p>');
    const inicioDoDia = new Date();
    inicioDoDia.setHours(0, 0, 0, 0);
    const [u, e] = await Promise.all([sb.rpc('admin_usuarios'), sb.rpc('admin_eventos', { desde: inicioDoDia.toISOString() })]);
    if (u.error || e.error) {
      return mostrarEstado(`<p>Não foi possível carregar os dados. ${esc((u.error || e.error).message)}</p><button class="botao" type="button" id="tentar">Tentar de novo</button>`);
    }
    usuarios = u.data || [];
    feed = [];
    contagem.checkins = 0;
    contagem.recordes = 0;
    (e.data || []).forEach((ev) => noFeed(ev.usuario_id, ev.tipo, ev.dados || {}, ev.criado_em));
    renderFeed();
    $('estado').hidden = true;
    $('conteudo').hidden = false;
    $('acoes').hidden = false;
    renderFora();
    ligarAoVivo();
  }

  document.addEventListener('click', async (e) => {
    if (e.target.closest('#entrar')) {
      await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
      return;
    }
    if (e.target.closest('#sair')) { desligarAoVivo(); await sb.auth.signOut(); return iniciar(); }
    if (e.target.closest('#tentar')) return iniciar();
    if (e.target.closest('#tela-cheia')) {
      if (document.fullscreenElement) document.exitFullscreen();
      else if ($('moldura').requestFullscreen) $('moldura').requestFullscreen().catch(() => {});
    }
  });
  document.addEventListener('fullscreenchange', () => { $('tela-cheia').textContent = document.fullscreenElement ? 'Sair da tela cheia' : 'Tela cheia'; });

  desenharMapa();
  requestAnimationFrame(animar);
  if (sb) {
    sb.auth.onAuthStateChange((evento) => {
      if (evento === 'SIGNED_OUT') desligarAoVivo();
      if (evento === 'SIGNED_IN' || evento === 'SIGNED_OUT') setTimeout(iniciar, 0);
    });
  }
  iniciar();
})();
</script>
</body>
</html>
